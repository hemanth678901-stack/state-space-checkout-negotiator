name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Run full test suite
        run: pytest tests/ -v --tb=short

      - name: Secret scan (regex safety check)
        run: |
          echo "=== Scanning tracked files for hardcoded secrets ==="
          # Fail if any tracked file contains likely API keys, private keys, or tokens
          if git grep -lE \
            '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36}|AKIA[A-Z0-9]{16}|AIza[a-zA-Z0-9_-]{35}|-----BEGIN .* PRIVATE KEY-----)' \
            -- ':(exclude).venv' ':(exclude)node_modules'; then
            echo "::error::Potential secrets detected in tracked files!"
            exit 1
          fi
          # Fail if any tracked file contains hardcoded local filesystem paths
          if git grep -lEi \
            '(e:\\\\|c:\\\\users|/home/[a-z]|/Users/[A-Z])' \
            -- ':(exclude).gitignore' ':(exclude).github'; then
            echo "::error::Hardcoded local machine paths detected in tracked files!"
            exit 1
          fi
          echo "Secret and path scan passed."
